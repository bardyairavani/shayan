<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Congratulations</title>

    <link rel="stylesheet" href="./main.css" />
  </head>

  <body>
    <div class="main-box">
      <div class="box">
        <div class="col-2">
          <img src="./image/1.svg" alt="1" />
        </div>

        <h2>Congratulations</h2>

        <div class="date-picker">
          <button class="date-box" id="dateBox" type="button">
            <span id="dateText">Choose a date</span>
          </button>
          <div class="calendar" id="calendar">
            <div class="calendar-header">
              <button id="prevMonth" type="button">‹</button>

              <span id="monthYear"></span>

              <button id="nextMonth" type="button">›</button>
            </div>

            <div class="calendar-days">
              <span>Su</span>
              <span>Mo</span>
              <span>Tu</span>
              <span>We</span>
              <span>Th</span>
              <span>Fr</span>
              <span>Sa</span>
            </div>

            <div class="calendar-dates" id="calendarDates"></div>
          </div>
        </div>
        <button class="submit-btn" id="submitBtn" type="button" disabled>
          Submit
        </button>
      </div>
    </div>

    <script>
      const dateBox = document.getElementById("dateBox");
      const dateText = document.getElementById("dateText");

      const calendar = document.getElementById("calendar");
      const calendarDates = document.getElementById("calendarDates");
      const monthYear = document.getElementById("monthYear");

      const prevMonth = document.getElementById("prevMonth");
      const nextMonth = document.getElementById("nextMonth");

      const submitBtn = document.getElementById("submitBtn");

      let currentDate = new Date();
      let selectedDate = null;

      // ==============================
      // Open / Close Calendar
      // ==============================

      dateBox.addEventListener("click", function (e) {
        e.stopPropagation();

        calendar.classList.toggle("active");
      });

      // ==============================
      // Render Calendar
      // ==============================

      function renderCalendar() {
        calendarDates.innerHTML = "";

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const monthName = currentDate.toLocaleString("en-US", {
          month: "long",
        });

        monthYear.textContent = `${monthName} ${year}`;

        // First day of month
        const firstDay = new Date(year, month, 1).getDay();

        // Number of days in month
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // Empty spaces before first day
        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement("div");

          calendarDates.appendChild(empty);
        }

        // Create days
        for (let day = 1; day <= daysInMonth; day++) {
          const button = document.createElement("button");

          button.type = "button";

          button.textContent = day;

          // Today
          const today = new Date();

          if (
            day === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
          ) {
            button.classList.add("today");
          }

          // Selected date
          if (
            selectedDate &&
            day === selectedDate.getDate() &&
            month === selectedDate.getMonth() &&
            year === selectedDate.getFullYear()
          ) {
            button.classList.add("selected");
          }

          // Select date
          button.addEventListener("click", function (e) {
            e.stopPropagation();

            selectedDate = new Date(year, month, day);

            // Format date
            const d = String(day).padStart(2, "0");

            const m = String(month + 1).padStart(2, "0");

            // Show selected date
            dateText.textContent = `${year}/${m}/${d}`;

            // Add selected style
            dateBox.classList.add("selected");

            // Enable Submit
            submitBtn.disabled = false;

            // Close calendar
            calendar.classList.remove("active");

            // Re-render calendar
            renderCalendar();
          });

          calendarDates.appendChild(button);
        }
      }

      // ==============================
      // Previous Month
      // ==============================

      prevMonth.addEventListener("click", function (e) {
        e.stopPropagation();

        currentDate.setMonth(currentDate.getMonth() - 1);

        renderCalendar();
      });

      // ==============================
      // Next Month
      // ==============================

      nextMonth.addEventListener("click", function (e) {
        e.stopPropagation();

        currentDate.setMonth(currentDate.getMonth() + 1);

        renderCalendar();
      });

      // ==============================
      // Close Calendar When Clicking Outside
      // ==============================

      document.addEventListener("click", function () {
        calendar.classList.remove("active");
      });

      // Prevent closing when clicking inside calendar
      calendar.addEventListener("click", function (e) {
        e.stopPropagation();
      });

      // ==============================
      // Submit
      // ==============================

      submitBtn.addEventListener("click", function () {
        // Don't submit without selecting a date
        if (!selectedDate) {
          return;
        }

        // Go to done.html
        window.location.href = "./done.html";
      });

      // ==============================
      // Initial Calendar
      // ==============================

      renderCalendar();
    </script>
  </body>
</html>
